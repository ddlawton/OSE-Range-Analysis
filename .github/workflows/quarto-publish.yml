name: Quarto Publish

on:
  push:
    branches: main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up R 4.5.2
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
          install-r: true
      - uses: actions/checkout@v4

      # Cache targets metadata for incremental builds
      - name: Cache targets pipeline
        uses: actions/cache@v3
        with:
          path: _targets
          key: targets-${{ hashFiles('_targets.R', 'R/**', 'data/raw/**') }}
          restore-keys: |
            targets-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff-dev \
            libcairo2-dev \
            imagemagick \
            libmagick++-dev \
            ghostscript \
            gdal-bin \
            libgdal-dev \
            libglpk-dev \
            libnode-dev \
            pandoc \
            cmake \
            libabsl-dev \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-noto-core \
            librsvg2-bin

          sudo apt-get install -y chromium-browser || true

      - name: Install Google Chrome
        run: |
          # Add Google signing key and repo
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - || true
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          # Try to install Google Chrome stable, fall back to Chromium if not available
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser || true

      - name: Configure Chrome for headless use
        run: |
          # Locate a chrome binary and expose it to the environment for R packages
          CHROME_BIN=$(which google-chrome-stable || which chromium || which chromium-browser || true)
          echo "CHROME_BIN=${CHROME_BIN}" >> $GITHUB_ENV
          # Recommended args for chromote/webshot2 in CI
          echo 'CHROMOTE_CHROME_ARGS=--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=0' >> $GITHUB_ENV

      # (Removed duplicate unpinned R setup step)
      - name: Query R version
        run: |
          which R
          R --version

      - name: Install renv and restore packages
        run: |
          Rscript -e 'install.packages("renv", repos="https://cran.r-project.org")'
          Rscript -e 'renv::restore(prompt = FALSE)'
          Rscript -e 'renv::install("ropensci/rnaturalearthhires")'
          # Reinstall glmmTMB from source to ensure it is compiled against the restored TMB version
          Rscript -e 'tryCatch(install.packages("glmmTMB", type = "source"), error = function(e) { message("glmmTMB reinstall failed: ", conditionMessage(e)); quit(status = 0) })'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Debug runner filesystem (diagnostics)
        run: |
          echo "Current working directory: $(pwd)"
          echo "-- ls R/analysis --"
          ls -la R/analysis || true
          echo "-- find manuscript files --"
          find . -maxdepth 4 -type f -name "manuscript_methods_results*" -print || true
          echo "-- git tracked files matching manuscript_methods_results --"
          git ls-files | grep "manuscript_methods_results" || true
          echo "-- git status --"
          git status --porcelain || true
          echo "-- renv::status() --"
          Rscript -e 'if (requireNamespace("renv", quietly=TRUE)) renv::status() else cat("renv not installed\n")'

      - name: Run targets pipeline
        run: |
          echo "Running targets pipeline to build models and derived outputs..."
          # Run the targets pipeline to produce model .rds and CSV outputs that Quarto will read
          Rscript -e 'if (!requireNamespace("targets", quietly=TRUE)) { stop("targets package not available. Ensure it is in renv.lock and restored.") }; targets::tar_make()'

      - run: quarto render

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site